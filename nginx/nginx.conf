events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # Matches the largest single upload this app accepts (documents, 20MB - see
    # DocumentService.MAX_FILE_SIZE_BYTES) plus headroom, so Nginx doesn't reject a request the
    # backend would otherwise happily accept.
    client_max_body_size 25M;

    server {
        listen 80;
        server_name _;

        # This vhost serves plain HTTP so it's testable without a real domain or certificates.
        # See the commented-out 443 block below for enabling TLS once you have both (e.g. via
        # certbot against a real domain) - not something fakeable in this environment.

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Chat streaming (POST .../messages) is Server-Sent Events - the backend already
            # sends X-Accel-Buffering: no on that response specifically (app/api/v1/messages.py)
            # for exactly this reason; proxy_buffering off here is Nginx's own belt-and-suspenders
            # covering the whole /api/ location rather than relying on the header alone.
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Next.js dev/HMR doesn't run in production, but Upgrade/Connection are cheap to
            # keep - the standalone server has no other use for a WebSocket-style upgrade today.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # --- HTTPS ---------------------------------------------------------------------------
    # Uncomment once real certificates for a real domain exist (e.g. via certbot's webroot or
    # DNS challenge against the domain in server_name). Until then this environment has neither
    # a domain nor certs to test against, so it stays commented rather than shipped unverified.
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.example;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #
    #     client_max_body_size 25M;
