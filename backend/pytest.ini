[pytest]
asyncio_mode = auto
# asyncio_default_fixture_loop_scope and asyncio_default_test_loop_scope are independent knobs -
# setting only the fixture one (as this file did originally) leaves TESTS on the function-scoped
# loop by default, so a fixture's async generator gets *set up* on the session loop during the
# test but *torn down* on a pytest-asyncio-internal Runner tied to the function loop once the test
# ends - surfaced as "RuntimeError: Event loop is closed" from deep inside httpx/anyio's transport
# cleanup, since the transport object captured the (by-then-closed) loop it originally opened on.
# Setting both to session keeps setup and teardown on the exact same loop throughout.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
