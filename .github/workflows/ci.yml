name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres/Redis as real service containers (not mocked/sqlite) - tests/conftest.py spins up
    # an actual uvicorn server and hits it over real HTTP, matching the "verify against real
    # infra" discipline used everywhere else in this project rather than special-casing CI to be
    # the one place that's faked.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ai_assistant
          POSTGRES_PASSWORD: ai_assistant
          POSTGRES_DB: ai_assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://ai_assistant:ai_assistant@localhost:5432/ai_assistant_test
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET_KEY: test-secret-key-not-for-real-use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # A real import, not just "pip install succeeded" - catches broken imports/config issues
      # that a clean requirements install wouldn't.
      - run: python -c "import app.main"
      # test_security_helpers.py's pure unit tests plus test_auth.py/test_conversations.py's real
      # HTTP integration tests (Phase 19) - both run in the same pytest invocation since they
      # share one pytest.ini/conftest.py and neither needs anything the services above don't
      # already provide.
      - run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ai-assistant-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t ai-assistant-frontend:ci ./frontend

      # Push only from main, never from a PR (an untested/unreviewed image should never reach the
      # registry) - GITHUB_TOKEN already has package-write scope for this repo's own GHCR
      # namespace, no extra secret/credential setup needed. This is the full extent of "CD" this
      # workflow does: getting a verified image somewhere pullable. Actually deploying it
      # somewhere (Phase 16e's Terraform-provisioned AWS infra) is a separate, deliberately
      # unautomated step - not something that should happen on every push to main without a
      # human deciding to.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker image references must be all-lowercase, but this repo's owner/name
      # (heyDev07/Chatgpt_working_clone) isn't - github.repository is used as-is verbatim, so
      # every `docker tag`/`docker push` below was rejecting the reference outright. Confirmed
      # live: the first two real runs of this workflow both had backend/frontend jobs pass and
      # docker-build fail specifically at the push step, exactly the signature of this bug (a
      # bad tag fails at tag/push time, not at build time, which is why build always succeeded).
      - name: Compute lowercase image repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Push backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ai-assistant-backend:ci ghcr.io/${{ env.IMAGE_REPO }}/backend:${{ github.sha }}
          docker tag ai-assistant-backend:ci ghcr.io/${{ env.IMAGE_REPO }}/backend:latest
          docker push ghcr.io/${{ env.IMAGE_REPO }}/backend:${{ github.sha }}
          docker push ghcr.io/${{ env.IMAGE_REPO }}/backend:latest

      - name: Push frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ai-assistant-frontend:ci ghcr.io/${{ env.IMAGE_REPO }}/frontend:${{ github.sha }}
          docker tag ai-assistant-frontend:ci ghcr.io/${{ env.IMAGE_REPO }}/frontend:latest
          docker push ghcr.io/${{ env.IMAGE_REPO }}/frontend:${{ github.sha }}
          docker push ghcr.io/${{ env.IMAGE_REPO }}/frontend:latest
