name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # A real import, not just "pip install succeeded" - catches broken imports/config issues
      # that a clean requirements install wouldn't.
      - run: python -c "import app.main"
      # Full integration coverage against real Postgres/Redis/Qdrant/MinIO is Phase 19's job -
      # this suite is intentionally just pure, dependency-free unit tests for now (the security-
      # critical functions from Phase 15's hardening pass), so it runs here without needing any
      # of that infra spun up as CI services.
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ai-assistant-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t ai-assistant-frontend:ci ./frontend

      # Push only from main, never from a PR (an untested/unreviewed image should never reach the
      # registry) - GITHUB_TOKEN already has package-write scope for this repo's own GHCR
      # namespace, no extra secret/credential setup needed. This is the full extent of "CD" this
      # workflow does: getting a verified image somewhere pullable. Actually deploying it
      # somewhere (Phase 16e's Terraform-provisioned AWS infra) is a separate, deliberately
      # unautomated step - not something that should happen on every push to main without a
      # human deciding to.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ai-assistant-backend:ci ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          docker tag ai-assistant-backend:ci ghcr.io/${{ github.repository }}/backend:latest
          docker push ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/backend:latest

      - name: Push frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ai-assistant-frontend:ci ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          docker tag ai-assistant-frontend:ci ghcr.io/${{ github.repository }}/frontend:latest
          docker push ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/frontend:latest
